# Continuous Integration — lint and test on every push / PR
name: CI

on:
  push:
    branches: [main, dev, "chore/**", "feature/**", "task/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        run: pytest -v

  docker-build:
    name: Docker — build smoke test
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t redash-chatbot-backend:ci ./backend
