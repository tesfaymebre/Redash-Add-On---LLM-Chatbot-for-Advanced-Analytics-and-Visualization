# Continuous Delivery — build container images for dev / prod branches
# Image push to a registry is gated on secrets (configure when deploying).
name: CD

on:
  push:
    branches: [main, dev]

jobs:
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: |
            redash-chatbot-backend:${{ github.ref_name }}
            redash-chatbot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment when GHCR (or another registry) credentials are configured:
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # Then set push: true and tags: ghcr.io/${{ github.repository }}/backend:...
